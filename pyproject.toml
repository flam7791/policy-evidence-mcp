[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "policy-evidence-mcp"
version = "0.4.0"
description = "MCP server giving AI assistants governed, cited access to official statistics (SDMX) and policy documents (RAG)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Flavio Mericio" }]
keywords = ["mcp", "model-context-protocol", "sdmx", "rag", "official-statistics", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=2.2,<3",      # official Model Context Protocol SDK (MCPServer)
    "httpx>=0.27,<1",   # HTTP client for the SDMX API
    "pypdf>=4.0",       # text extraction for PDF documents
    "tomli>=2.0; python_version < '3.11'",  # SharePoint sync configuration on Python 3.10
    "opentelemetry-api>=1.27",  # tracing hooks; a no-op until the `tracing` extra is configured
]

[project.optional-dependencies]
tracing = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "opentelemetry-sdk>=1.27", "pyyaml>=6"]

[project.scripts]
evidence-mcp = "evidence_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

# Recorded exceptions to the engineering standards (checked by aief check).
[tool.aief.waivers]
ENG-11 = "Operated as a component of governed-ai-platform: see its docs/runbook.md and docs/lifecycle.md"
