name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit, protocol and end-to-end tests (offline)
        run: pytest
      - name: Dependency vulnerability scan (the project's own dependencies)
        run: pip install pip-audit && pip-audit .
      - name: Retrieval evaluation (quality gate)
        env:
          EVIDENCE_MCP_MAX_CLASSIFICATION: internal
        run: |
          evidence-mcp ingest --corpus sample_corpus --out build/index.json
          evidence-mcp eval --questions evals/sample_questions.jsonl --index build/index.json --min-hit 0.8
      - name: Hybrid search evaluation (replays recorded vectors, no model needed)
        if: hashFiles('evals/embeddings.json') != ''
        env:
          EVIDENCE_MCP_MAX_CLASSIFICATION: internal
        run: |
          CACHE="--embeddings-cache evals/embeddings.json --offline"
          evidence-mcp ingest --corpus sample_corpus --out build/hybrid.json --embeddings $CACHE
          evidence-mcp eval --questions evals/sample_questions.jsonl --index build/hybrid.json \
            --mode hybrid --min-hit 0.8 $CACHE
          # Paraphrases: report both modes; only a leak fails the build here.
          evidence-mcp eval --questions evals/paraphrase_questions.jsonl --index build/hybrid.json \
            --mode compare --min-hit 0 $CACHE

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t policy-evidence-mcp .
