# Custom connector for Microsoft Copilot Studio: the evidence server as an MCP tool.
# Import in Copilot Studio > Tools > Add a tool > New tool > Custom connector > Import OpenAPI file.
# Replace the host, the tenant ID (twice) and, if yours differs, the API's Application ID URI.
# See README.md in this folder.
swagger: "2.0"
info:
  title: Policy evidence
  description: >-
    Cited statistics and policy documents over the Model Context Protocol. Every answer carries
    its citation; documents are filtered by the signed-in user's clearance (Entra ID app roles).
  version: 0.3.1
host: evidence.example.org
basePath: /
schemes:
  - https
paths:
  /mcp:
    post:
      summary: Policy evidence MCP server
      description: Search documents and statistics, with citations, within the user's clearance.
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeMCP
      responses:
        "200":
          description: Success
securityDefinitions:
  entra:
    type: oauth2
    flow: accessCode
    authorizationUrl: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/oauth2/v2.0/authorize
    tokenUrl: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/oauth2/v2.0/token
    scopes:
      api://policy-evidence/Evidence.Read: Read statistics and documents within your clearance
security:
  - entra:
      - api://policy-evidence/Evidence.Read
